async function askQ(){const q=$('#aq').value.trim();if(!q)return;$('#ab').textContent='…';let a='';try{const m=await claude.use('sample');const r=await m.json('به این پرسش به فارسی روان، دقیق و بر پایه‌ی منابع و پژوهش‌های معتبر پاسخ بده. فقط JSON خالص: {"a":"پاسخ"}\nپرسش: '+q);a=r.a}catch(e){}if(!a){const w=q.split(/\s+/);let b=null,bs=0;KB.forEach(k=>{const sc=k[0].split(' ').filter(x=>q.includes(x)).length;if(sc>bs){bs=sc;b=k}});a=b?b[1]:'پاسخ هوشمند برای پرسش‌های آزاد به اتصال یک سرویس هوش مصنوعی (کلید API) نیاز دارد که هنوز به برنامه وصل نشده. فعلاً درباره‌ی مطالعه، تمرکز، خواب، عادت و وزن پاسخ آماده دارم.'}S.qa={q,a};save();render()}

function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const m=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13&&gd>m[gm];gm++)gd-=m[gm];return[gy,gm,gd]}

const OLS={'detective':'detective_and_mystery_stories','conduct of life':'conduct_of_life','science fiction':'science_fiction','persian':'persian_literature'};
const iaB=(i,t,a)=>({id:'a'+i,t,a:a||'',src:'a',ia:i,cov:'https://archive.org/services/img/'+i,u:'https://archive.org/download/'+i+'/'+i+'_djvu.txt',pdf:'https://archive.org/download/'+i+'/'+i+'.pdf'});
async function olSub(t){const j=await fx('https://openlibrary.org/subjects/'+(OLS[t]||t.replace(/ /g,'_'))+'.json?limit=40&ebooks=true',1);return(j.works||[]).filter(w=>w.availability&&w.availability.status=='open'&&w.availability.identifier).map(w=>iaB(w.availability.identifier,w.title,(w.authors[0]||{}).name))}
async function bCat(t,l){BL.cat=l;BL.q='';BL.busy=1;BL.msg='';BL.err=null;render();let L=null;try{const j=await fx('https://gutendex.com/books/?topic='+encodeURIComponent(t),1);L=(j.results||[]).map(gB);BL.next=j.next||null}catch(e){}if(!L||!L.length){try{L=await olSub(t);BL.next=null}catch(e){L=[]}}BL.list=L;BL.msg=L.length?f(L.length)+' کتاب':'الان به منبع کتاب‌ها دسترسی نداریم؛ دکمه‌ی تلاش دوباره را بزن.';if(!L.length)BL.err=()=>bCat(t,l);BL.busy=0;render()}
async function bSearch(){const q=($('#bq')||{value:''}).value.trim();if(!q)return;BL.q=q;BL.cat='';BL.busy=1;BL.msg='';BL.err=null;render();const g='https://gutendex.com/books/?search='+encodeURIComponent(q),a='https://archive.org/advancedsearch.php?q='+encodeURIComponent('('+q+') AND mediatype:texts AND NOT access-restricted-item:true')+'&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&rows=20&output=json',o='https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&has_fulltext=true&limit=20&fields=title,author_name,ia,public_scan_b',r=await Promise.allSettled([fx(g,1),fx(a,1),fx(o,1)]);let L=[];BL.next=null;if(r[0].status=='fulfilled'){L=(r[0].value.results||[]).map(gB);BL.next=r[0].value.next||null}if(r[1].status=='fulfilled')L=L.concat(((r[1].value.response||{}).docs||[]).map(d=>{const i=d.identifier;return{id:'a'+i,t:Array.isArray(d.title)?d.title[0]:d.title,a:Array.isArray(d.creator)?d.creator[0]:d.creator||'',src:'a',ia:i,cov:'https://archive.org/services/img/'+i,u:'https://archive.org/download/'+i+'/'+i+'_djvu.txt',pdf:'https://archive.org/download/'+i+'/'+i+'.pdf'}}));if(r[2].status=='fulfilled'){const seen=new Set(L.map(x=>x.ia).filter(Boolean));L=L.concat((r[2].value.docs||[]).filter(d=>d.public_scan_b&&d.ia&&!seen.has(d.ia[0])).map(d=>iaB(d.ia[0],d.title,(d.author_name||[])[0])))}BL.list=L;BL.msg=L.length?f(L.length)+' نتیجه برای «'+q+'»':(r.every(x=>x.status=='rejected')?'اتصال به منبع کتاب‌ها برقرار نشد؛ دکمه‌ی تلاش دوباره را بزن.':'نتیجه‌ای پیدا نشد؛ نام انگلیسی کتاب یا نویسنده را امتحان کن');if(!L.length&&r.every(x=>x.status=='rejected'))BL.err=bSearch;BL.busy=0;render()}
const bClean=t=>{const a=t.search(/\*\*\* ?START OF/i);if(a>=0)t=t.slice(t.indexOf('\n',a)+1);const b=t.search(/\*\*\* ?END OF/i);if(b>0)t=t.slice(0,b);return t.replace(/\r/g,'')};
function bPages(t){const P=t.split(/\n\s*\n/).map(x=>x.replace(/\s*\n\s*/g,' ').trim()).filter(x=>x.length>1),pg=[];let cur=[],n=0;P.forEach(x=>{cur.push(x);n+=x.length;if(n>2200){pg.push(cur);cur=[];n=0}});if(cur.length)pg.push(cur);return pg}
async function bOpen(b,emb){BR.on=1;BR.b=b;S.bp=S.bp||{};BR.p=S.bp[b.id]||0;BR.pages=[];BR.msg='';BR.emb=emb||0;if(emb){render();return}BR.busy=1;render();try{let t=await fx(b.u);if(b.h)t=new DOMParser().parseFromString(t.replace(/<\/(p|div|h\d)>/gi,'\n\n'),'text/html').body.textContent;BR.pages=bPages(bClean(t));if(!BR.pages.length)throw 0;BR.p=Math.min(BR.p,BR.pages.length-1)}catch(e){BR.msg='متن کتاب بارگذاری نشد؛ دوباره امتحان کن، یا از لینک دانلود استفاده کن.'}BR.busy=0;render()}
const bOpenS=i=>bOpen(S.bk[i]);
function bJump(p){BR.p=Math.max(0,Math.min(BR.pages.length-1,p));S.bp[BR.b.id]=BR.p;save();render();window.scrollTo(0,0)}
function bSave(){S.bk=S.bk||[];const b=BR.b,i=S.bk.findIndex(x=>x.id==b.id);if(i>=0)S.bk.splice(i,1);else S.bk.push(b);save();render()}
const ck=t=>{const o=[];let c='';(t.match(/[^.!?؟]+[.!?؟]+["”’']*\s*|[^.!?؟]+$/g)||[t]).forEach(x=>{if((c+x).length>800&&c){o.push(c);c=''}c+=x});if(c)o.push(c);return o};
async function trT(t){if(TC[t])return TC[t];let out='';for(const c of ck(t)){const r=await fx('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=fa&dt=t&q='+encodeURIComponent(c),1);out+=(r[0]||[]).map(x=>x[0]).join('')+' '}return TC[t]=out.trim()}
async function bTr(){if(!S.bt)return;const tk=BR.tk=Math.random(),ps=BR.pages[BR.p]||[];let i=0;const w=async()=>{while(i<ps.length&&BR.tk==tk){const k=i++,el=document.getElementById('tp'+k);if(!el)continue;try{el.textContent=await trT(ps[k])}catch(e){el.textContent='(ترجمه نشد؛ دوباره صفحه را عوض کن یا اینترنت را بررسی کن)'}}};await Promise.all([w(),w(),w()])}
function vRead(){const b=BR.b,n=BR.pages.length,sv=(S.bk||[]).some(x=>x.id==b.id),fs=S.bf||17,dl=[b.epub&&['EPUB',b.epub],b.pdf&&['PDF',b.pdf],b.u&&['TXT',b.u]].filter(Boolean),nav=n?`<div class="row" style="justify-content:space-between;margin:10px 0"><button class="btn g s" onclick="bJump(${BR.p-1})">صفحه‌ی قبل</button><span class="mu">${f(BR.p+1)} از ${f(n)}</span><button class="btn s" onclick="bJump(${BR.p+1})">صفحه‌ی بعد</button></div>`:'';
return `<div class="card"><div class="row" style="justify-content:space-between"><button class="btn g s" onclick="BR.on=0;BR.tk=0;render()">← بازگشت</button><button class="btn g s" onclick="bSave()">${sv?'★ در کتابخانه‌ی من':'☆ ذخیره'}</button></div><h3 style="direction:ltr;text-align:left">${esc(b.t)}</h3><div class="mu" style="direction:ltr;text-align:left">${esc(b.a)}</div><div class="row" style="justify-content:flex-start;margin-top:8px">${dl.map(d=>`<a class="btn g s" target="_blank" rel="noopener" href="${esc(d[1])}">دانلود ${d[0]}</a>`).join('')}${b.src=='a'?`<button class="btn s" onclick="bOpen(BR.b,1)">خواندن PDF</button><button class="btn s" onclick="bOpen(BR.b)">متن + ترجمه</button>`:''}</div></div>`+(BR.emb?`<iframe class="yt" style="aspect-ratio:auto;height:80vh" src="https://archive.org/embed/${esc(b.ia)}" allowfullscreen></iframe>`:BR.busy?'<p class="mu">در حال بارگذاری کتاب...</p>':BR.msg?`<p class="mu">${esc(BR.msg)}</p><div class="row"><button class="btn s" onclick="bOpen(BR.b)">تلاش دوباره</button></div>`:`<div class="card"><div class="row"><label class="row" style="cursor:pointer"><input type="checkbox" ${S.bt?'checked':''} onchange="S.bt=this.checked;save();render()"> <span>ترجمه‌ی فارسی زیر هر پاراگراف</span></label><button class="x" onclick="S.bf=Math.max(13,${fs}-2);save();render()">A−</button><button class="x" onclick="S.bf=Math.min(30,${fs}+2);save();render()">A+</button></div>${nav}<input type="range" min="0" max="${Math.max(0,n-1)}" value="${BR.p}" style="width:100%;padding:0" onchange="bJump(+this.value)">${(BR.pages[BR.p]||[]).map((x,k)=>`<p dir="ltr" style="text-align:left;font-size:${fs}px;line-height:1.9;margin:14px 0 6px">${esc(x)}</p>${S.bt?`<p id="tp${k}" dir="rtl" style="font-size:${fs-1}px;line-height:2;color:var(--ac);margin:0 0 14px">در حال ترجمه...</p>`:''}`).join('')}${nav}</div>`)}
function vLib(){if(BR.on)return vRead();const bi=(b,i,src)=>`<div class="li"><img src="${esc(b.cov||'icon-192.png')}" width="52" height="72" style="border-radius:8px;flex:none;object-fit:cover;background:#fff" loading="lazy" alt="" onerror="this.style.visibility='hidden'"><div class="g" style="min-width:0"><b style="direction:ltr;display:block;text-align:left">${esc(b.t)}</b><div class="mu" style="direction:ltr;text-align:left">${esc(b.a)}${b.src=='a'?' · آرشیو اینترنت':''}</div>${src?`<div class="mu">صفحه‌ی ${f(((S.bp||{})[b.id]||0)+1)}</div>`:''}</div><button class="btn s" onclick="${src?'bOpenS('+i+')':'bOpen(BL.list['+i+'])'}">خواندن</button></div>`;
return `<div class="card"><div class="row"><input id="bq" placeholder="نام کتاب یا نویسنده (ترجیحاً انگلیسی)" value="${esc(BL.q)}" style="flex:1;min-width:200px;direction:ltr" onkeydown="if(event.key=='Enter')bSearch()"><button class="btn s" onclick="bSearch()">جستجو</button></div><h3 style="margin-top:14px">ژانرها</h3><div class="chips">${GC.map(g=>`<button class="chip ${BL.cat==g[0]?'on':''}" onclick="bCat('${g[1]}','${g[0]}')">${g[0]}</button>`).join('')}</div></div>${(S.bk||[]).length?`<div class="card"><h3>کتابخانه‌ی من</h3>${S.bk.map((b,i)=>bi(b,i,1)).join('')}</div>`:''}<div class="card">${BL.cat?`<h3>${BL.cat}</h3>`:''}${BL.busy?'<p class="mu">در حال بارگذاری... (اگر کند بود چند ثانیه صبر کن)</p>':''}${BL.msg?`<p class="mu">${esc(BL.msg)}</p>`:'<p class="mu">یک ژانر را انتخاب کن یا نام کتاب را جستجو کن.</p>'}${BL.err&&!BL.busy?'<div class="row"><button class="btn s" onclick="BL.err()">تلاش دوباره</button></div>':''}${BL.list.map((b,i)=>bi(b,i,0)).join('')}${BL.next&&!BL.busy?`<div class="row" style="margin-top:12px"><button class="btn" onclick="bFetch('${BL.next}',1)">کتاب‌های بیشتر</button></div>`:''}<p class="mu" style="line-height:1.9">کتاب‌ها از Project Gutenberg و آرشیو اینترنت می‌آیند و فقط شامل آثار آزاد و دامنه‌ی عمومی هستند (معمولاً کتاب‌های قدیمی‌تر از حدود ۱۰۰ سال). کتاب‌های جدید دارای کپی‌رایت در دسترس نیستند.</p></div>`}
function vWis2(){const seg='<div class="seg" style="margin-bottom:14px">'+[['l','کتابخانه'],['w','حکمت امروز']].map(a=>`<button class="${wsub==a[0]?'on':''}" onclick="wsub='${a[0]}';render()">${a[1]}</button>`).join('')+'</div>';return wsub=='w'?vWis().replace('<h2>حکمت امروز</h2>','<h2>حکمت</h2>'+seg):'<h2>حکمت</h2>'+seg+vLib()}
const _rn2=render;render=function(){_rn2();if(tab=='wis'&&wsub=='l'&&BR.on&&!BR.emb)bTr()};

render();
</script>
