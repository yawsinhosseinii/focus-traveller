function bell(c,out,f,t0,dur,vol){[1,2.76,5.4,8.9].forEach((m,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol/(i*1.6+1),t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur/(i*.5+1));o.connect(g);g.connect(out);o.start(t0);o.stop(t0+dur+.1)})}
function playAlarm(k,v){const c=ac();if(!c)return;v=v==null?.6:v;const m=c.createGain();m.gain.value=v;const d=c.createDelay(1),fb=c.createGain(),wet=c.createGain();d.delayTime.value=.28;fb.gain.value=.38;wet.gain.value=.45;m.connect(c.destination);m.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(c.destination);

for(let r=0;r<2;r++)s.forEach((f,i)=>bell(c,m,f,t+r*(s.length*gp+.8)+i*gp,2.4,.22));
try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}}

function noiseBuf(c,type){const n=c.sampleRate*4,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(type=='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b}

function ambStart(k){const c=ac();if(!c)return;ambStop();try{MU.au.pause()}catch(e){}const g=c.createGain();g.gain.value=MU.vol;g.connect(c.destination);const nodes=[g],src=t=>{const s=c.createBufferSource();s.buffer=noiseBuf(c,t);s.loop=true;nodes.push(s);return s},fl=(t,f,q)=>{const x=c.createBiquadFilter();x.type=t;x.frequency.value=f;if(q)x.Q.value=q;nodes.push(x);return x},gn=v=>{const x=c.createGain();x.gain.value=v;nodes.push(x);return x},lfo=(fr,am,tg)=>{const o=c.createOscillator(),a=gn(am);o.frequency.value=fr;o.connect(a);a.connect(tg);o.start();nodes.push(o)};

const KB=[['خواندن مطالعه یادگیری حفظ کتاب درس','بهترین روش مطالعه (بر پایه‌ی پژوهش‌های شناختی و توصیه‌ی افراد موفق)\n۱) یادآوری فعال: بعد از هر بخش کتاب را ببند و آنچه یادت مانده را بنویس یا بگو. این روش از دوباره‌خوانی بسیار مؤثرتر است (پژوهش‌های Roediger و Karpicke).\n۲) تکرار فاصله‌دار: مرور بعد از ۱ روز، ۳ روز، ۱ هفته و ۱ ماه.\n۳) روش فاینمن: مطلب را طوری توضیح بده که انگار به یک کودک می‌گویی؛ جاهای گیر را دوباره بخوان.\n۴) روش SQ3R برای کتاب: مرور سریع، سؤال ساختن، خواندن، بازگویی، مرور (مورتیمر آدلر در «چگونه کتاب بخوانیم» هم بر خواندن سؤال‌محور تأکید دارد).\n۵) کار عمیق (کال نیوپورت): ۹۰ دقیقه بدون گوشی، بعد استراحت.\n۶) خواب کافی؛ حافظه در خواب تثبیت می‌شود.'],['تمرکز حواس پرتی گوشی','برای تمرکز: گوشی را از اتاق بیرون بگذار، یک هدف مشخص برای هر جلسه بنویس، ۲۵ تا ۹۰ دقیقه کار کن و بعد ۵ تا ۱۵ دقیقه استراحت واقعی. سخت‌ترین کار را صبح یا در اوج انرژی انجام بده.'],['خواب','بزرگسال معمولاً ۷ تا ۹ ساعت خواب لازم دارد. ساعت ثابت خواب و بیداری، نور صبح، قطع کافئین بعد از ظهر و دور بودن از صفحه‌نمایش یک ساعت قبل از خواب مهم‌ترین عادت‌هاست.'],['عادت انگیزه پشتکار','عادت‌ها را کوچک شروع کن (جیمز کلیر، «عادت‌های اتمی»): کار را خیلی آسان کن، به عادت قبلی بچسبانش و هر روز ثبتش کن. تداوم مهم‌تر از شدت است.'],['وزن لاغری چاقی تغذیه رژیم','برای کم کردن وزن به‌صورت پایدار: کسری کالری متوسط، پروتئین کافی، تمرین مقاومتی، قدم زدن روزانه و خواب خوب. هر هفته ۰٫۲۵ تا ۱ درصد وزن بدن کاهش منطقی است. در صورت بیماری با پزشک مشورت کن.']];
function vAsk(){const a=S.qa;return `<h2>پرسش</h2><div class="card"><p class="mu">هر چیزی بپرس.</p><div class="row"><input id="aq" placeholder="مثلاً بهترین روش خواندن کتاب چیست؟" style="flex:1;min-width:220px" onkeydown="if(event.key==\'Enter\')askQ()"><button class="btn" id="ab" onclick="askQ()">بپرس</button></div></div>${a?`<div class="card"><h3>${esc(a.q)}</h3><div class="ans">${esc(a.a)}</div></div>`:''}`}
async function askQ(){const q=$('#aq').value.trim();if(!q)return;$('#ab').textContent='…';let a='';try{const m=await claude.use('sample');const r=await m.json('به این پرسش به فارسی روان، دقیق و بر پایه‌ی منابع و پژوهش‌های معتبر پاسخ بده. فقط JSON خالص: {"a":"پاسخ"}\nپرسش: '+q);a=r.a}catch(e){}if(!a){const w=q.split(/\s+/);let b=null,bs=0;KB.forEach(k=>{const sc=k[0].split(' ').filter(x=>q.includes(x)).length;if(sc>bs){bs=sc;b=k}});a=b?b[1]:'پاسخ هوشمند برای پرسش‌های آزاد به اتصال یک سرویس هوش مصنوعی (کلید API) نیاز دارد که هنوز به برنامه وصل نشده. فعلاً درباره‌ی مطالعه، تمرکز، خواب، عادت و وزن پاسخ آماده دارم.'}S.qa={q,a};save();render()}
/* youtube */
function ytId(u){const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:'')}
function vYt(){const id=S.yt||'';return `<h2>یوتیوب</h2><div class="card"><div class="row"><input id="yu" placeholder="لینک ویدیو یا کلمه برای جستجو" value="" style="flex:1;min-width:220px" onkeydown="if(event.key==\'Enter\')ytGo()"><button class="btn" onclick="ytGo()">پخش</button></div></div>${id?`<div class="card"><iframe class="yt" src="https://www.youtube-nocookie.com/embed/${id}?hl=fa&cc_load_policy=1&cc_lang_pref=fa&rel=0" allow="accelerometer;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen loading="lazy"></iframe><p class="mu" style="line-height:1.9">اگر ویدیو زیرنویس فارسی داشته باشد خودکار روشن می‌شود. برای ویدیوهای بدون زیرنویس، در پخش‌کننده ⚙️ ← Subtitles ← Auto-translate ← فارسی را بزن.</p></div>`:''}`}
function ytGo(){const v=$('#yu').value.trim();if(!v)return;const id=ytId(v);if(id){S.yt=id;save();render()}else window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(v),'_blank','noopener')}

render();
</script>
