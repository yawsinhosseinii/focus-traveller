<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جنگل تمرکز</title>
<meta name="theme-color" content="#02040a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="جنگل تمرکز"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f4ec;--bg2:#d4ead9;--pn:rgba(255,255,255,.72);--bd:rgba(20,70,45,.12);--tx:#12301f;--mu:#5b7a68;--ac:#1f9d5a;--ac2:#14724a;--sun:#e8a21b;--dn:#d4503f;--tr:rgba(20,70,45,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a15;--bg2:#0f2a21;--pn:rgba(24,56,45,.62);--bd:rgba(150,255,200,.12);--tx:#e6f6ec;--mu:#8fb5a1;--ac:#5fe39a;--ac2:#2fb877;--sun:#ffc857;--dn:#ff7a66;--tr:rgba(150,255,200,.09)}}
:root[data-theme="dark"]{--bg:#0b1a15;--bg2:#0f2a21;--pn:rgba(24,56,45,.62);--bd:rgba(150,255,200,.12);--tx:#e6f6ec;--mu:#8fb5a1;--ac:#5fe39a;--ac2:#2fb877;--sun:#ffc857;--dn:#ff7a66;--tr:rgba(150,255,200,.09)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 85% -10%,var(--bg2),transparent),radial-gradient(700px 500px at 0% 110%,var(--bg2),transparent),var(--bg);background-attachment:fixed}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;max-width:1250px;margin:auto}
nav{padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;font-size:22px;display:flex;gap:10px;align-items:center;margin-bottom:18px}
.logo svg{width:36px;height:36px}
nav button{all:unset;cursor:pointer;padding:12px 14px;border-radius:14px;color:var(--mu);font-weight:500;display:flex;gap:10px;align-items:center;transition:.2s}
nav button:hover{background:var(--tr)}
nav button.on{background:var(--ac);color:#06241a;font-weight:800;box-shadow:0 8px 24px -8px var(--ac)}
nav .sp{flex:1}
.coin{padding:12px 14px;border-radius:14px;background:var(--pn);border:1px solid var(--bd);font-size:14px}
main{padding:24px 20px 60px;min-width:0}
h2{margin:0 0 16px;font-size:24px;font-weight:800}h3{margin:0 0 12px;font-size:16px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:22px;padding:20px;backdrop-filter:blur(14px);margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:14px}
.stat b{display:block;font-size:22px;font-weight:800}.stat span{color:var(--mu);font-size:13px}
.ringw{position:relative;width:min(320px,80vw);aspect-ratio:1;margin:8px auto}
.ringw svg.r{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringw .in svg{width:55%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.big{font-size:42px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;padding:13px 28px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#05231a;font-weight:800;text-align:center;transition:.2s;box-shadow:0 10px 26px -10px var(--ac)}
.btn:hover{transform:translateY(-2px)}.btn.g{background:var(--tr);color:var(--tx);box-shadow:none}.btn.d{background:var(--dn);color:#fff}.btn.s{padding:7px 12px;font-size:13px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;background:var(--tr);font-size:14px;border:1px solid transparent}
.chip.on{border-color:var(--ac);color:var(--ac);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
input,select{font:inherit;color:var(--tx);background:var(--tr);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=range]{width:min(320px,80%);accent-color:var(--ac);padding:0}
.bar{height:10px;border-radius:9px;background:var(--tr);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--sun));transition:width .6s}
.chart{display:flex;align-items:flex-end;gap:4px;height:190px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.col i{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--ac),var(--ac2));min-height:2px;transition:height .5s}
.col small{font-size:10px;color:var(--mu);margin-top:4px;height:14px;white-space:nowrap}
.seg{display:inline-flex;background:var(--tr);border-radius:14px;padding:4px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:8px 18px;border-radius:11px;font-weight:500}.seg .on{background:var(--ac);color:#05231a;font-weight:800}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}.li .g{flex:1}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.forest{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.forest svg{width:100%;aspect-ratio:1}
.mu{color:var(--mu);font-size:13px}.dead{opacity:.55}
.done{text-decoration:line-through;opacity:.5}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#05231a;padding:12px 22px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media(max-width:760px){.app{grid-template-columns:1fr}
nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--pn);backdrop-filter:blur(18px);border-top:1px solid var(--bd);z-index:20;justify-content:space-around}
nav button{flex-direction:column;gap:2px;font-size:11px;padding:8px 10px}.logo,.coin,nav .sp{display:none}main{padding-bottom:100px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
html:root:root:not([data-theme="light"]){--bg:#02040a;--bg2:#0a1220;--pn:rgba(12,18,32,.6);--bd:rgba(255,205,140,.16);--tx:#f1ece2;--mu:#9aa6b8;--ac:#ffb454;--ac2:#e0701f;--sun:#ffe2a8;--dn:#ff5a4a;--tr:rgba(255,220,170,.08)}
html:not([data-theme="light"]) body{background:#02040a}
html[data-theme="light"] #sp{display:none}
#sp{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.app{position:relative;z-index:1}
.card,.stat,.coin{box-shadow:0 20px 60px -30px #000,inset 0 1px 0 rgba(255,255,255,.07)}
h2{font-weight:300;font-size:30px;text-shadow:0 0 24px rgba(255,180,84,.4)}
.logo{color:var(--sun)}
nav button.on,.btn,.chip.on,.seg .on{color:#1a0d02}.chip.on{color:var(--sun)}
nav button.on{box-shadow:0 0 30px -4px var(--ac)}
.ringw{--p1:#7ad1ff;--p2:#134a7a}
.ringw::before{content:'';position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--p1),var(--p2) 58%,#000 100%);opacity:.55;box-shadow:0 0 70px -4px var(--p2)}
.big{font-weight:300;font-size:50px;text-shadow:0 0 24px var(--ac)}
.planets{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.pl{all:unset;cursor:pointer;width:88px;text-align:center;font-size:12px;color:var(--mu);transition:.25s}
.pl i{display:block;width:64px;height:64px;border-radius:50%;margin:0 auto 6px;position:relative;box-shadow:inset -10px -8px 18px rgba(0,0,0,.7),0 0 24px -4px var(--g)}
.pl i svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px)}
.pl:hover{transform:translateY(-3px)}.pl.on{color:var(--sun);transform:translateY(-5px)}.pl.on i{outline:2px solid var(--ac);outline-offset:3px}
.ringw{width:min(360px,82vw);margin:40px auto 70px}.ringw::before{display:none}.ringw .in svg{width:30%}.big{font-size:38px;color:#fff}#ring{stroke:#a8d0ff}
.goalv{text-align:center;height:52px;display:flex;align-items:center;justify-content:center}.goalv b{font-size:26px;font-weight:300;color:var(--sun);text-shadow:0 0 18px var(--ac);white-space:nowrap}
.gs{width:100%;accent-color:var(--ac);padding:0;margin:6px 0 14px;display:block}
.tg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.tg div{background:var(--tr);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.8}.tg b{display:block;color:var(--ac);font-size:12px;margin-bottom:2px}
@media(max-width:760px){nav button{padding:8px 4px!important;font-size:10px}}
body:not([data-t="timer"]) #sp{opacity:.4}
#sp{transition:opacity .5s}
.card{background:linear-gradient(160deg,rgba(255,200,140,.07),rgba(255,255,255,.01)),var(--pn)}
.btn.go{padding:17px 52px;font-size:18px;border-radius:20px;letter-spacing:.3px}.btn:active{transform:scale(.97)}
nav{padding-top:calc(24px + env(safe-area-inset-top,0px))}.logo{font-size:24px;text-shadow:0 0 22px rgba(255,180,84,.5)}
nav button{font-size:15px}.stat b{font-weight:300;font-size:24px;color:var(--sun)}
.chip{transition:.2s}.chip:hover{border-color:var(--bd)}
html:root:root{--ok:#4fd17f}
textarea{resize:vertical}
.card,.stat,.coin,nav{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html:root:root:not([data-theme="light"]){--pn:rgba(8,14,28,.74)}
</style>
</head>
<body>
<canvas id="sp"></canvas><div class="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const K='forestfa2';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{ss:[],sub:[{id:1,n:'ریاضی',c:'#5fe39a'},{id:2,n:'فیزیک',c:'#5ab0e8'},{id:3,n:'ادبیات',c:'#ff9f7a'},{id:4,n:'زبان',c:'#ffc857'}],tk:[],goal:240,ex:[],T:null,kind:0,sel:1,dur:25,mode:'t',th:''};
const save=()=>{S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
const $=s=>document.querySelector(s),f=n=>Math.round(n).toLocaleString('fa-IR');
const hm=m=>m<60?f(m)+' دقیقه':f(Math.floor(m/60))+' ساعت'+(m%60?' و '+f(m%60)+' دقیقه':'');
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],DN=['ش','ی','د','س','چ','پ','ج'];
const JF=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'});
const J=d=>{const p=JF.formatToParts(d),g=t=>+p.find(x=>x.type===t).value.replace(/\D/g,'');return{y:g('year'),m:g('month'),d:g('day')}};
const sd=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x},add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const jstr=d=>{const j=J(d);return f(j.d)+' '+MN[j.m-1]+' '+f(j.y).replace(/٬/g,'')};
const sub=id=>S.sub.find(s=>s.id==id)||{n:'بدون درس',c:'#999'};
const KINDS=[['#3fbf6f','#2a9658'],['#f2a65a','#d9772f'],['#e86b8a','#c24266'],['#5ab0e8','#3688c9']];
const PL=[{n:'زمین',a:'#4fd17f',b:'#2a9658',s:'r',p1:'#7fe39e',p2:'#1d6b3e'},{n:'میلر',a:'#6fe0ff',b:'#2a8fd0',s:'c',p1:'#7ad1ff',p2:'#134a7a'},{n:'مان',a:'#e8f4ff',b:'#9fc4e8',s:'p',p1:'#ffffff',p2:'#6a86a8'},{n:'ادموندز',a:'#ffb454',b:'#e0701f',s:'m',p1:'#ffd08a',p2:'#8a3d10'},{n:'تیتان',a:'#ff8fb3',b:'#d8527f',s:'r',p1:'#ffb3cc',p2:'#7a2a48'},{n:'اروپا',a:'#3fe0c0',b:'#1c9c88',s:'p',p1:'#6ff2d8',p2:'#0d5a4e'},{n:'کپلر',a:'#c49bff',b:'#7a4fd8',s:'c',p1:'#d8baff',p2:'#3b2480'},{n:'مریخ',a:'#ff7a5a',b:'#c2432a',s:'m',p1:'#ffa58a',p2:'#6e1f10'}];
function tree(p,k,dead){const q=PL[k%8],[a,b]=dead?['#8a7f6b','#6d634f']:[q.a,q.b],h=6+p*46,r=5+p*24,y=88-h,c=(cx,cy,rr,o)=>`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${o}"/>`;
let s=`<svg viewBox="0 0 100 100"${q.s=='c'&&!dead?` style="filter:drop-shadow(0 0 5px ${a})"`:''}><ellipse cx="50" cy="90" rx="${24+p*14}" ry="6" fill="#000" opacity=".25"/>`;
if(p<.08)s+=`<path d="M40 90q10-12 20 0z" fill="#8b5e3c"/><path d="M50 82q-1-8 5-10" stroke="${a}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
else{if(q.s!='c'||dead)s+=`<rect x="${48.5-p*2}" y="${y}" width="${3+p*4}" height="${h}" rx="2" fill="#8b5e3c"/>`;
if(dead)s+=`<path d="M50 ${y+8}l-14 -8M50 ${y+14}l14 -9" stroke="#6d634f" stroke-width="2.5" stroke-linecap="round"/>`+c(50,y-2,r*.5,b);
else if(q.s=='r')s+=c(50-r*.55,y+r*.3,r*.75,b)+c(50+r*.55,y+r*.3,r*.75,b)+c(50,y-r*.2,r,a)+c(50-r*.25,y-r*.45,r*.4,'#fff3');
else if(q.s=='p')for(let i=0;i<3;i++){const w=r*(.8+i*.45),t=y-r*.9+i*r*.75;s+=`<path d="M50 ${t}L${50-w} ${t+r}L${50+w} ${t+r}Z" fill="${i%2?b:a}"/>`}
else if(q.s=='m'){s+=[-75,-38,0,38,75].map(g=>`<path d="M50 ${y}L${50+Math.sin(g*.0175)*r*1.4} ${y-Math.cos(g*.0175)*r*.9+r*.35}" stroke="${g%2?a:b}" stroke-width="${3+p*4}" stroke-linecap="round"/>`).join('')+c(50,y+2,2+p*3,'#8b5e3c')}
else{const d=(x0,yy,w,hh,o)=>`<path d="M${x0} ${yy-hh}L${x0+w} ${yy}L${x0} ${yy+hh*.35}L${x0-w} ${yy}Z" fill="${o}"/>`;s+=d(50,88-h*.2,r*.55,h*.8,b)+d(50-r*.7,88-h*.1,r*.35,h*.5,a)+d(50+r*.7,88-h*.1,r*.35,h*.5,a)+d(50,88-h*.25,r*.25,h*.7,'#fff5')}}
return s+'</svg>'}
function treeOld(p,k,dead){const [a,b]=dead?['#8a7f6b','#6d634f']:KINDS[k%4],h=6+p*46,r=5+p*24,y=88-h,c=(cx,cy,rr,col)=>`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="${col}"/>`;
let s=`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="90" rx="${24+p*14}" ry="6" fill="#000" opacity=".18"/>`;
if(p<.08)s+=`<path d="M40 90q10-12 20 0z" fill="#8b5e3c"/><path d="M50 82q-1-8 5-10" stroke="${a}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
else{s+=`<rect x="${48.5-p*2}" y="${y}" width="${3+p*4}" height="${h}" rx="2" fill="#8b5e3c"/>`;
if(dead)s+=`<path d="M50 ${y+8}l-14 -8M50 ${y+14}l14 -9" stroke="#6d634f" stroke-width="2.5" stroke-linecap="round"/>`+c(50,y-2,r*.5,b);
else s+=c(50-r*.55,y+r*.3,r*.75,b)+c(50+r*.55,y+r*.3,r*.75,b)+c(50,y-r*.2,r,a)+c(50-r*.25,y-r*.45,r*.4,'#fff3')}
return s+'</svg>'}
function beep(){try{const A=new(window.AudioContext||window.webkitAudioContext)(),t=A.currentTime;[660,880,1100].forEach((fq,i)=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=fq;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.2,t+i*.18);g.gain.exponentialRampToValueAtTime(.001,t+i*.18+.4);o.start(t+i*.18);o.stop(t+i*.18+.4)})}catch(e){}}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function theme(){if(S.th)document.documentElement.dataset.theme=S.th}theme();

/* ranges */
const sm=d=>{let s=sd(d);while(J(s).d>1)s=add(s,-1);return s};
function range(p,off){const b=sd(new Date());let s,e,bk=[],t;
if(p=='d'){s=add(b,off);e=add(s,1);for(let h=0;h<24;h++)bk.push({l:h%3?'':f(h),s:+s+h*36e5,e:+s+(h+1)*36e5});t=jstr(s)}
else if(p=='w'){s=add(b,-((b.getDay()+1)%7)+off*7);e=add(s,7);for(let i=0;i<7;i++)bk.push({l:DN[i],s:+add(s,i),e:+add(s,i+1)});t=jstr(s)+' تا '+jstr(add(e,-1))}
else if(p=='m'){s=sm(b);for(let i=0;i<Math.abs(off);i++)s=sm(off<0?add(s,-1):add(s,32));e=sm(add(s,32));for(let d=s,i=1;d<e;d=add(d,1),i++)bk.push({l:i%5==1?f(i):'',s:+d,e:+add(d,1)});const j=J(s);t=MN[j.m-1]+' '+f(j.y).replace(/٬/g,'')}
else{s=sd(b);const ys=d=>{while(!(J(d).m==1&&J(d).d==1))d=add(d,-1);return d};s=ys(s);for(let i=0;i<Math.abs(off);i++)s=ys(off<0?add(s,-1):add(s,370));e=ys(add(s,370));let cur;for(let d=s;d<e;d=add(d,1)){if(J(d).d==1){cur={l:MN[J(d).m-1].slice(0,4),s:+d,e:+d};bk.push(cur)}cur.e=+add(d,1)}t=f(J(s).y).replace(/٬/g,'')}
return{s:+s,e:+e,bk,t,p}}
const ok=(a,b)=>S.ss.filter(x=>x.start>=a&&x.start<b);
function streak(){let n=0,d=sd(new Date());if(!ok(+d,+add(d,1)).some(x=>x.min>0))d=add(d,-1);while(ok(+d,+add(d,1)).some(x=>x.min>0)){n++;d=add(d,-1)}return n}
const tm=a=>a.reduce((s,x)=>s+x.min,0);
function addSession(x){S.ss.push({id:Date.now()+Math.random(),...x});save()}

/* timer */
let tab='timer',rp='w',roff=0,foff=0,tickI;
const T_=()=>S.T;
function startT(){const dur=S.mode=='t'?S.dur:0;S.T={start:Date.now(),dur,mode:S.mode,subj:S.sel,kind:S.kind,tid:S.tid};save();try{Notification.requestPermission()}catch(e){}render()}
function finishT(giveup){const T=S.T,el=(Date.now()-T.start)/6e4,min=T.mode=='t'?T.dur:Math.floor(el);
if(giveup){if(el>=.05)addSession({start:T.start,min:(spend(T.tid,Math.max(1,Math.round(el))),Math.max(1,Math.round(el))),subj:T.subj,ok:false,k:T.kind,p:Math.min(1,el/(T.mode=='t'?T.dur:120))});toast('درخت پژمرد 🥀 '+hm(Math.max(1,Math.round(el)))+' ثبت شد')}
else if(min>=1){addSession({start:T.start,min,subj:T.subj,ok:true,k:T.kind,p:1});spend(T.tid,min);beep();toast('یک درخت کاشتی 🌳 '+hm(min));try{new Notification('جنگل تمرکز',{body:'جلسه تمام شد!'})}catch(e){}}
S.T=null;document.title='جنگل تمرکز';save();render()}
function tick(){const T=S.T;if(!T)return;const el=(Date.now()-T.start)/1e3;let p,txt;
if(T.mode=='t'){const left=T.dur*60-el;if(left<=0)return finishT(false);p=el/(T.dur*60);txt=Math.floor(left/60).toString().padStart(2,'0')+':'+Math.floor(left%60).toString().padStart(2,'0')}
else{p=Math.min(1,el/7200);txt=Math.floor(el/60).toString().padStart(2,'0')+':'+Math.floor(el%60).toString().padStart(2,'0')}
const a=$('#tt');if(!a)return;a.textContent=txt.replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);document.title=a.textContent+' | تمرکز';
$('#ring').setAttribute('stroke-dashoffset',(754*(1-p)).toFixed(1));const tw=$('#tw'),st=Math.round(p*20);if(tw.dataset.s!=st){tw.dataset.s=st;tw.innerHTML=tree(p,T.kind,false)}}
function giveUp(){const b=$('#gu');if(b.dataset.c){finishT(true);return}b.dataset.c=1;b.textContent='مطمئنی؟ دوباره بزن';setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent='انصراف (درخت می‌میره)'}},3500)}
setInterval(tick,500);

return `<h2>تمرکز کن، درخت بکار 🌱</h2><div class="stats"><div class="stat"><b>${hm(m)}</b><span>امروز</span></div><div class="stat"><b>${f(streak())} روز</b><span>پیاپی</span></div><div class="stat"><b>${f(S.ss.filter(x=>x.ok).length)}</b><span>درخت زنده</span></div></div>
<div class="card" style="background:none;border:0;backdrop-filter:none;box-shadow:none"><div class="ringw" style="--p1:${PL[T?T.kind:S.kind%8].p1};--p2:${PL[T?T.kind:S.kind%8].p2}"><svg class="r" viewBox="0 0 260 260"><circle cx="130" cy="130" r="120" fill="none" stroke="var(--tr)" stroke-width="12"/><circle id="ring" cx="130" cy="130" r="120" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="754" style="filter:drop-shadow(0 0 8px var(--ac))"/></svg>
<div class="in"><div id="tw" style="display:contents">${tree(.0,T?T.kind:S.kind,false)}</div><div class="big" id="tt">${f(S.mode=='t'?S.dur:0).padStart?'':''}${S.mode=='t'?f(S.dur)+':۰۰':'۰۰:۰۰'}</div></div></div>
${T?`<div class="row"><span class="chip on"><span class="dot" style="background:${sub(T.subj).c};display:inline-block"></span> ${sub(T.subj).n}</span><button class="btn d" id="gu" onclick="giveUp()">انصراف (درخت می‌میره)</button>${T.mode=='s'?'<button class="btn" onclick="finishT(false)">پایان و کاشت</button>':''}</div>`:
`<div class="row"><div class="seg"><button class="${S.mode=='t'?'on':''}" onclick="S.mode='t';save();render()">تایمر</button><button class="${S.mode=='s'?'on':''}" onclick="S.mode='s';save();render()">کرونومتر</button></div></div>

<div class="chips">${S.sub.map(s=>`<button class="chip ${S.sel==s.id?'on':''}" onclick="S.sel=${s.id};save();render()"><span class="dot" style="background:${s.c};display:inline-block"></span> ${s.n}</button>`).join('')}</div>
<div class="mu" style="text-align:center">سیاره و گونه درخت</div><div class="planets">${PL.map((q,i)=>`<button class="pl ${S.kind==i?'on':''}" style="--g:${q.p1}" onclick="S.kind=${i};save();render()"><i style="background:radial-gradient(circle at 32% 28%,${q.p1},${q.p2} 72%)">${tree(.75,i)}</i>${q.n}</button>`).join('')}</div><div class="mu" style="text-align:center">ماموریت</div><div class="chips">${S.tk.filter(t=>!t.done).slice(0,8).map(t=>`<button class="chip ${S.tid==t.id?'on':''}" onclick="S.tid=S.tid==${t.id}?0:${t.id};S.sel=${t.s};save();render()">🛰 ${t.t}</button>`).join('')||'<span class="mu">از تب برنامه یک کار اضافه کن</span>'}</div>
<div class="row"><button class="btn go" onclick="startT()">🌱 شروع کاشت</button></div>`}</div>
<div class="card"><h3>هدف روزانه: ${hm(m)} از ${hm(S.goal)}</h3><div class="bar"><i style="width:${g}%"></i></div></div>`}

function vForest(){const r=range('m',foff),a=ok(r.s,r.e),days={};a.forEach(x=>{const k=+sd(x.start);(days[k]=days[k]||[]).push(x)});
return `<h2>جنگل من</h2>${nav('f')}<div class="stats"><div class="stat"><b>${f(a.filter(x=>x.ok).length)}</b><span>درخت زنده</span></div><div class="stat"><b>${f(a.filter(x=>!x.ok).length)}</b><span>درخت پژمرده</span></div><div class="stat"><b>${hm(tm(a))}</b><span>تمرکز این ماه</span></div></div>
<div class="card">${Object.keys(days).length?Object.keys(days).sort((x,y)=>y-x).map(k=>`<h3>${jstr(new Date(+k))}</h3><div class="forest" style="margin-bottom:14px">${days[k].map(x=>`<div class="${x.ok?'':'dead'}" title="${sub(x.subj).n} - ${hm(x.min)}">${tree(x.p??1,x.k||0,!x.ok)}</div>`).join('')}</div>`).join(''):'<p class="mu">این ماه هنوز درختی نکاشتی. از تب تایمر شروع کن.</p>'}</div>`}

function vReport(){const r=range(rp,roff),a=ok(r.s,r.e),tot=tm(a),vals=r.bk.map(b=>tm(a.filter(x=>x.start>=b.s&&x.start<b.e))),mx=Math.max(...vals,1),act=vals.filter(v=>v>0).length,bi=vals.indexOf(Math.max(...vals));
const bys=S.sub.map(s=>({...s,m:tm(a.filter(x=>x.subj==s.id))})).filter(s=>s.m>0).sort((x,y)=>y.m-x.m);

<div class="stats"><div class="stat"><b>${hm(tot)}</b><span>مجموع تمرکز</span></div><div class="stat"><b>${f(a.filter(x=>x.ok).length)}</b><span>جلسه موفق</span></div><div class="stat"><b>${f(a.filter(x=>!x.ok).length)}</b><span>انصراف</span></div><div class="stat"><b>${hm(act?tot/act:0)}</b><span>میانگین هر ${unit} فعال</span></div><div class="stat"><b>${tot?r.bk[bi].l||f(bi+1):'-'}</b><span>بهترین ${unit}</span></div><div class="stat"><b>${f(streak())}</b><span>روز پیاپی</span></div></div>
<div class="card"><h3>نمودار زمان تمرکز</h3><div class="chart">${vals.map((v,i)=>`<div class="col" title="${hm(v)}"><i style="height:${v/mx*88}%"></i><small>${r.bk[i].l}</small></div>`).join('')}</div></div>
<div class="grid"><div class="card"><h3>به تفکیک درس</h3>${bys.length?bys.map(s=>`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span><span class="dot" style="background:${s.c};display:inline-block"></span> ${s.n}</span><span class="mu">${hm(s.m)} · ${f(s.m/tot*100)}٪</span></div><div class="bar"><i style="width:${s.m/tot*100}%;background:${s.c}"></i></div></div>`).join(''):'<p class="mu">داده‌ای نیست.</p>'}</div>
<div class="card"><h3>ثبت دستی زمان مطالعه</h3><div class="row"><select id="ms">${S.sub.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}</select><input id="mm" type="number" min="1" placeholder="دقیقه" style="width:100px"><input id="md" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn s" onclick="manual()">ثبت</button></div>
<h3 style="margin-top:18px">جلسه‌های این بازه</h3>${a.slice().sort((x,y)=>y.start-x.start).slice(0,12).map(x=>`<div class="li"><span class="dot" style="background:${sub(x.subj).c}"></span><div class="g">${sub(x.subj).n}<div class="mu">${jstr(new Date(x.start))} ${x.ok?'':'· انصراف'}</div></div><b>${hm(x.min)}</b><button class="btn g s" onclick="S.ss=S.ss.filter(y=>y.id!=${x.id});save();render()">حذف</button></div>`).join('')||'<p class="mu">جلسه‌ای نیست.</p>'}</div></div>`}

return `<h2>برنامه مطالعه</h2><div class="grid"><div class="card"><h3>کارهای من</h3><div class="row" style="margin-bottom:10px"><input id="tn" placeholder="مثلا: حل تمرین فصل ۳" style="flex:1;min-width:150px"><select id="ts">${S.sub.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}</select><input id="td" type="date"><button class="btn s" onclick="addT()">افزودن</button></div>
${sorted.map(t=>`<div class="li"><input type="checkbox" ${t.done?'checked':''} onchange="tg(${t.id})" style="width:20px;height:20px;accent-color:var(--ac)"><div class="g ${t.done?'done':''}">${t.t}<div class="mu"><span class="dot" style="background:${sub(t.s).c};display:inline-block"></span> ${sub(t.s).n}${t.spent?' · '+hm(t.spent)+' تمرکز':''}${t.due?' · '+jstr(new Date(t.due+'T12:00')):''}${t.due&&!t.done&&+new Date(t.due+'T00:00')<td?' · <b style="color:var(--dn)">عقب‌افتاده</b>':''}</div></div>${t.done?'':`<button class="btn s" onclick="S.sel=${t.s};tab='timer';save();render()">شروع</button>`}<button class="btn g s" onclick="S.tk=S.tk.filter(y=>y.id!=${t.id});save();render()">✕</button></div>`).join('')||'<p class="mu">هنوز کاری اضافه نکردی.</p>'}</div>
<div class="card"><h3>شمارش معکوس امتحان‌ها</h3><div class="row" style="margin-bottom:10px"><input id="en" placeholder="نام امتحان" style="flex:1;min-width:120px"><input id="ed" type="date"><button class="btn s" onclick="addE()">افزودن</button></div>
${S.ex.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(e=>{const n=Math.ceil((new Date(e.d+'T00:00')-td)/864e5);return `<div class="li"><div class="g"><b>${e.n}</b><div class="mu">${jstr(new Date(e.d+'T12:00'))}</div></div><b style="color:${n<7?'var(--dn)':'var(--ac)'}">${n>=0?f(n)+' روز مانده':'گذشته'}</b><button class="btn g s" onclick="S.ex=S.ex.filter(y=>y.id!=${e.id});save();render()">✕</button></div>`}).join('')||'<p class="mu">تاریخ امتحان‌ها را اضافه کن.</p>'}</div></div>`}
function addT(){const t=$('#tn').value.trim();if(!t)return;S.tk.push({id:Date.now(),t,s:+$('#ts').value,due:$('#td').value,done:0});save();render()}

function vSet(){return `<h2>تنظیمات</h2><div class="grid"><div class="card">${accCard()}</div><div class="card"><h3>نصب روی گوشی و لپ‌تاپ</h3><p class="mu" style="line-height:1.9">آیفون: در Safari دکمه Share و بعد Add to Home Screen. اندروید: در Chrome منو و بعد Install app. ویندوز و مک: آیکون نصب در نوار آدرس Chrome یا Edge.</p><button id="inst" class="btn s" style="display:${DI?'':'none'}" onclick="doInst()">نصب برنامه</button></div><div class="card"><h3>درس‌ها</h3>${S.sub.map(s=>`<div class="li"><input type="color" value="${s.c}" onchange="sub(${s.id}).c=this.value;save()" style="width:40px;padding:2px"><div class="g">${s.n}</div><button class="btn g s" onclick="if(S.sub.length>1){S.sub=S.sub.filter(y=>y.id!=${s.id});S.sel=S.sub[0].id;save();render()}">حذف</button></div>`).join('')}<div class="row" style="margin-top:10px"><input id="sn" placeholder="درس جدید" style="flex:1"><button class="btn s" onclick="const n=$('#sn').value.trim();if(n){S.sub.push({id:Date.now(),n,c:'#'+Math.floor(Math.random()*0xffffff|0x808080).toString(16).slice(0,6).padStart(6,'8')});save();render()}">افزودن</button></div></div>
<div class="card"><h3>هدف روزانه</h3><div class="goalv"><b id="gl">${hm(S.goal)}</b></div><input class="gs" type="range" min="30" max="1440" step="30" value="${S.goal}" oninput="S.goal=+this.value;$('#gl').textContent=hm(S.goal)" onchange="save();render()" aria-label="هدف روزانه"><div class="chips">${[120,240,360,480,720,1440].map(g=>`<button class="chip ${S.goal==g?'on':''}" onclick="S.goal=${g};save();render()">${f(g/60)} ساعت</button>`).join('')}</div><h3 style="margin-top:20px">ظاهر</h3><div class="seg">${[['','خودکار'],['light','روشن'],['dark','تیره']].map(([k,l])=>`<button class="${S.th==k?'on':''}" onclick="S.th='${k}';if(!'${k}')delete document.documentElement.dataset.theme;theme();save();render()">${l}</button>`).join('')}</div>
<h3 style="margin-top:20px">پشتیبان‌گیری</h3><div class="row"><button class="btn g s" onclick="exp()">دریافت فایل</button><label class="btn g s">بازیابی<input type="file" accept=".json" hidden onchange="imp(this)"></label></div></div></div>`}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='forest-backup.json';a.click()}

function spend(id,m){const t=S.tk.find(x=>x.id==id);if(t){t.spent=(t.spent||0)+m;save()}}

const SY={t:'',s:null};
function sync(t){SY.t=t;const e=$('#sy2');if(e)e.textContent=t}
const CF=()=>{try{return JSON.parse(localStorage.getItem('forestcf'))||{}}catch(e){return{}}};
const sb=async(path,o={})=>{const c=CF(),r=await fetch(c.url.replace(/\/$/,'')+path,{...o,headers:{apikey:c.key,'Content-Type':'application/json',...((SY.s&&SY.s.access_token)?{Authorization:'Bearer '+SY.s.access_token}:{}),...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||('خطا '+r.status));return j};
function setSess(j){SY.s={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1e3-6e4,uid:j.user?j.user.id:SY.s.uid,email:j.user?j.user.email:SY.s.email};try{localStorage.setItem('forestss',JSON.stringify(SY.s))}catch(e){}}
async function authDo(kind){const e=$('#ae').value.trim(),p=$('#ap').value;if(!e||p.length<6)return toast('ایمیل و رمز (حداقل ۶ حرف) لازم است');try{const j=await sb(kind=='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})});if(!j.access_token)return toast('ایمیل‌ات را تایید کن، بعد وارد شو');setSess(j);await pull();render()}catch(x){toast(x.message)}}
async function refresh(){const s=SY.s;if(!s)return false;if(Date.now()<s.exp)return true;try{const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});setSess(j);return true}catch(e){return false}}
async function up(){await sb('/rest/v1/user_state?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:SY.s.uid,data:S,ts:S.ts||Date.now()})})}
async function pull(){if(!SY.s||!(await refresh()))return sync('💾 ذخیره محلی');try{const r=await sb('/rest/v1/user_state?select=data,ts&user_id=eq.'+SY.s.uid);if(r[0]){if(!S.ts||r[0].ts>S.ts){SY.lock=1;S=r[0].data;S.ts=r[0].ts;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();SY.lock=0}else if(r[0].ts<S.ts)await up()}else await up();sync('☁️ همگام')}catch(e){sync('⚠️ خطای همگام‌سازی')}}
function push(){clearTimeout(push.t);if(!SY.s||SY.lock)return;push.t=setTimeout(async()=>{try{if(await refresh()){await up();sync('☁️ همگام')}}catch(e){sync('⚠️ خطای همگام‌سازی')}},1500)}
function logout(){SY.s=null;try{localStorage.removeItem('forestss')}catch(e){}sync('💾 ذخیره محلی');render()}
function saveCf(){const u=$('#su').value.trim(),k=$('#sk').value.trim();if(!/^https?:\/\//.test(u)||k.length<20)return toast('آدرس و کلید را درست وارد کن');try{localStorage.setItem('forestcf',JSON.stringify({url:u,key:k}))}catch(e){}render()}
function accCard(){const c=CF(),i='style="width:100%;margin-bottom:8px;direction:ltr"';

if(!c.url)return `<h3>حساب و همگام‌سازی (اختیاری)</h3><p class="mu" style="line-height:1.9">برنامه بدون حساب هم کامل کار می‌کند و اطلاعات روی همین دستگاه می‌ماند. برای همگام‌سازی گوشی و لپ‌تاپ، آدرس و کلید پروژه رایگان Supabase را یک‌بار وارد کن (راهنما در README).</p><input id="su" placeholder="Project URL" ${i}><input id="sk" placeholder="anon public key" ${i}><button class="btn s" onclick="saveCf()">ذخیره</button>`;
return `<h3>ورود یا ساخت حساب</h3><input id="ae" type="email" placeholder="ایمیل" ${i}><input id="ap" type="password" placeholder="رمز (حداقل ۶ حرف)" ${i}><div class="row" style="justify-content:flex-start"><button class="btn s" onclick="authDo('in')">ورود</button><button class="btn g s" onclick="authDo('up')">ساخت حساب</button><button class="btn g s" onclick="localStorage.removeItem('forestcf');render()">تغییر پروژه</button></div>`}
try{SY.s=JSON.parse(localStorage.getItem('forestss'))}catch(e){}
if(SY.s&&CF().url)pull();else sync('💾 ذخیره محلی');
setInterval(()=>{if(SY.s&&!document.hidden)pull()},60000);

<div class="card"><h3>سود و زیان هر بازه</h3><div class="chart" style="height:200px">${vals.map((v,i)=>`<div class="col" title="${fm(v)}" style="justify-content:flex-start"><div style="flex:1;display:flex;align-items:flex-end;width:100%;justify-content:center"><i style="height:${v>0?v/mx*100:0}%;min-height:0;background:linear-gradient(180deg,#7ff0ad,var(--ok))"></i></div><div style="flex:1;display:flex;align-items:flex-start;width:100%;justify-content:center"><i style="height:${v<0?-v/mx*100:0}%;min-height:0;background:linear-gradient(0deg,#ff9b8c,var(--dn));border-radius:3px 3px 7px 7px"></i></div><small>${r.bk[i].l}</small></div>`).join('')}</div></div>
<div class="grid"><div class="card"><h3>منحنی رشد حساب</h3>${a.length?`<svg viewBox="0 0 300 80" preserveAspectRatio="none" style="width:100%;height:120px"><polyline points="${line}" fill="none" stroke="${k.net>=0?'var(--ok)':'var(--dn)'}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`:'<p class="mu">هنوز معامله‌ای در این بازه نیست.</p>'}</div>
<div class="card"><h3>به تفکیک ستاپ</h3>${Object.keys(sets).map(n=>{const o=sets[n];return `<div class="li"><div class="g">${n}<div class="mu">${f(o.n)} معامله · ویناریت ${f(o.w/o.n*100)}٪</div></div><b style="color:${c(o.p)}">${fm(o.p)}</b></div>`}).join('')||'<p class="mu">داده‌ای نیست.</p>'}</div></div>
<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">معامله‌های این بازه</h3><button class="btn g s" onclick="exportTr()">دانلود CSV</button></div>${a.slice().reverse().slice(0,25).map(t=>`<div class="li"><div class="g"><b>${t.sym}</b> <span class="mu">${t.dir=='S'?'فروش':'خرید'} · ${jstr(new Date(t.ts))}${t.setup?' · '+t.setup:''}</span>${t.note?`<div class="mu">${t.note}</div>`:''}</div><b style="color:${c(pnlOf(t))}">${fm(pnlOf(t))}</b><button class="btn g s" onclick="S.tr=S.tr.filter(y=>y.id!=${t.id});save();render()">✕</button></div>`).join('')||'<p class="mu">معامله‌ای ثبت نشده.</p>'}</div>`}
render();
</script>
</body>
</html>
